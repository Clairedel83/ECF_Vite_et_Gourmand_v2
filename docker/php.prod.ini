; Rend les variables du conteneur accessibles dans $_ENV.
variables_order = "EGPCS"

; N'affiche pas les erreurs PHP dans les pages envoyées aux visiteurs.
display_errors = Off
display_startup_errors = Off

; Enregistre les erreurs dans les journaux du conteneur.
log_errors = On
error_log = /proc/self/fd/2

; N'affiche pas la version de PHP dans l'en-tête X-Powered-By.
expose_php = Off