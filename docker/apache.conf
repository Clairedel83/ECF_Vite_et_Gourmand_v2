# configuration apache

<VirtualHost *:80>
    # Dossier accessible depuis le navigateur
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Autorise l'accès à ce dossier
        Require all granted

        # Centralise la configuration ici, sans utiliser de .htaccess
        AllowOverride None

        # Fichier utilisé quand on demande la racine du site
        DirectoryIndex index.php

        # Transmet à Symfony les URL qui ne désignent pas un fichier existant
        FallbackResource /index.php
    </Directory>
</VirtualHost>